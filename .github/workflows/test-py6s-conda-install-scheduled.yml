name: Scheduled Py6S conda install test
on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # at 07:14 on a Sunday
    - cron:  '14 7 * * 0'
  workflow_dispatch:
jobs:
  test-py6s:
    name: Test Py6S from conda install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: true
          activate-environment: py6s-test
          miniconda-version: "latest"
      - shell: bash -l {0}
        run: |
          conda install -y py6s
      - shell: bash -l {0}
        run: python -c "from Py6S import *; SixS.test()"
